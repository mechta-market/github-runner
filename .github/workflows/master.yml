name: Deploy
on:
  push:
    branches:
      - master
    # go-service.yml и front.yml — в образ кладутся архивы их действий
    paths:
      - Dockerfile
      - .github/workflows/master.yml
      - .github/workflows/go-service.yml
      - .github/workflows/front.yml
  # раз в неделю — свежие версия раннера GitHub и пакеты Ubuntu: слишком старый раннер
  # GitHub перестаёт пускать к заданиям
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      OWNER: mechta-market
      IMAGE: github-runner:latest
    steps:
      - uses: actions/checkout@v6

      - run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u $ --password-stdin

      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker build --pull --secret id=github_token,env=GITHUB_TOKEN -t ghcr.io/$OWNER/$IMAGE .

      - run: docker push ghcr.io/$OWNER/$IMAGE
