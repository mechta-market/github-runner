name: Go service

# Общая сборка Go-сервиса на раннерах yc-arc: бинарник собирается на раннере (кэш Go в S3),
# затем docker-образ уходит в ghcr.io/<owner>/. Вызов из репозитория сервиса:
#
#   jobs:
#     build:
#       uses: mechta-market/github-runner/.github/workflows/go-service.yml@master
#       with:
#         image: s3-get:latest
#
# Необязательное: несколько имён образа через пробел (image: "price_tags:master price_tags:latest"),
# проверка перед сборкой (test: go vet ./... && go test ./...), выгрузка proto-контракта в
# репозиторий protos (protos: nsi_v1 + secrets: protos-token: ${{ secrets.PROTOS_PAT }}),
# Node для сборки фронта на раннере (node: 24 + build: make && make build-admin) — Dockerfile
# тогда только копирует готовую статику; Dockerfile не в корне (dockerfile: docker/app.Dockerfile),
# аргументы сборки образа (build-args: GIT_SHA=${{ github.sha }}), сколько старых версий образа
# без тега оставить в ghcr (keep-untagged, по умолчанию 10; 0 — удалить все).

on:
  workflow_call:
    inputs:
      image:
        description: Имя образа с тегом, без ghcr.io/<owner>/ (по умолчанию <имя репозитория>:latest). Несколько — через пробел, образ собирается один раз
        type: string
        default: ""
      build:
        description: Команда сборки бинарника на раннере
        type: string
        default: make
      dockerfile:
        description: Путь к Dockerfile от корня репозитория; контекст сборки — всегда корень
        type: string
        default: Dockerfile
      build-args:
        description: Аргументы docker build через пробел, KEY=VALUE (значения без пробелов), например GIT_SHA=<коммит> (в вызове — выражение github.sha)
        type: string
        default: ""
      test:
        description: Команда проверки перед сборкой, например go test ./... (пусто — без проверки)
        type: string
        default: ""
      node:
        description: Версия Node из образа раннера (22, 24) для сборки фронта в build/test; pnpm и yarn — по packageManager из package.json (пусто — без Node)
        type: string
        default: ""
      protos:
        description: Каталог api/proto/<protos>, который после пуша образа копируется в репозиторий protos (пусто — не копировать)
        type: string
        default: ""
      keep-untagged:
        description: Сколько последних версий образа без тега оставить после пуша, остальные удаляются; 0 — удалить все (части образов с тегом не трогаются никогда), пусто — ничего не удалять
        type: string
        default: "10"
    secrets:
      protos-token:
        description: Токен с правом записи в репозиторий protos (нужен вместе с protos)
        required: false

# Действия закреплены по sha: их архивы лежат в образе раннера (Dockerfile берёт sha отсюда),
# и раннер не скачивает их с GitHub. Новая версия — сменить sha здесь, образ раннера пересоберётся сам.
jobs:
  build:
    name: Build and deploy
    runs-on: yc-arc
    steps:
      # токен задания не остаётся в .git/config, где его прочли бы тесты и сборка
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Go берётся из образа раннера; GOTOOLCHAIN=local — узнать его версию, не скачивая toolchain из go.mod
      - run: echo "GOVERSION=$(GOTOOLCHAIN=local go env GOVERSION)" >> $GITHUB_ENV

      - uses: runs-on/cache@a5f51d6f3fece787d03b7b4e981c82538a0654ed # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ env.GOVERSION }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: ${{ env.GOVERSION }}-

      # нужная версия Node — первой в PATH; хранилище pnpm, кэш npm и скачанный corepack-ом pnpm — в S3
      - if: inputs.node != ''
        env:
          NODE: ${{ inputs.node }}
        run: |
          bin="$FNM_DIR/aliases/$NODE/bin"
          if [ ! -x "$bin/node" ]; then
            echo "::error::Node $NODE нет в образе раннера, есть: $(ls $FNM_DIR/aliases | grep -vx default | xargs)"
            exit 1
          fi
          echo "$bin" >> $GITHUB_PATH
          # хранилище pnpm — на том же томе, что и проект (_work — отдельный том, домашняя папка на
          # другом, и pnpm сам ушёл бы в _work/.pnpm-store мимо кэша); pnpm 9–10 читают npm_config_*,
          # pnpm 11 — pnpm_config_*
          store="$(dirname "$RUNNER_WORKSPACE")/.pnpm-store"
          echo "npm_config_store_dir=$store" >> $GITHUB_ENV
          echo "pnpm_config_store_dir=$store" >> $GITHUB_ENV

      - if: inputs.node != ''
        uses: runs-on/cache@a5f51d6f3fece787d03b7b4e981c82538a0654ed # v4
        with:
          path: |
            ${{ env.pnpm_config_store_dir }}
            ~/.npm
            ~/.cache/node/corepack
          key: node${{ inputs.node }}-store-${{ hashFiles('**/pnpm-lock.yaml', '**/package-lock.json', '**/yarn.lock') }}
          restore-keys: node${{ inputs.node }}-store-

      # проверка и сборка — до входа в ghcr: код тестов и зависимостей не видит токен записи в реестр
      - if: inputs.test != ''
        run: ${{ inputs.test }}

      - run: ${{ inputs.build }}

      - run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u $ --password-stdin

      - env:
          IMAGE: ${{ inputs.image }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          BUILD_ARGS: ${{ inputs.build-args }}
        run: |
          images=""
          for i in ${IMAGE:-${GITHUB_REPOSITORY#*/}:latest}; do
            images="$images ghcr.io/${{ github.repository_owner }}/$i"
          done
          args=""
          for a in $BUILD_ARGS; do
            args="$args --build-arg $a"
          done
          docker build -f "$DOCKERFILE" $args $(printf -- '-t %s ' $images) .
          for i in $images; do docker push $i; done

      # proto-контракт уходит в protos только из сервиса, который собрался и запушился
      - if: inputs.protos != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository_owner }}/protos
          token: ${{ secrets.protos-token }}
          path: protos
          fetch-depth: 1

      - if: inputs.protos != ''
        env:
          PROTOS: ${{ inputs.protos }}
        run: |
          mkdir -p "protos/$PROTOS"
          cp -a "api/proto/$PROTOS/." "protos/$PROTOS/"
          cd protos
          if [ -n "$(git status --porcelain)" ]; then
            git config user.email "github-action@github.com"
            git config user.name "github-actions"
            git add .
            git commit -m "update ${GITHUB_REPOSITORY#*/}"
            git push
          fi

      # Пуш переносит тег на новый образ, а старый остаётся в ghcr без тега — такие версии копятся
      # без конца. Последние keep-untagged остаются для отката по sha, остальные удаляются.
      # Образ с тегом — оглавление (index), его части (образ под платформу, запись о сборке) лежат
      # в пакете отдельными версиями без тега; их не трогаем, иначе образ с тегом перестанет скачиваться.
      # Версии моложе часа тоже не трогаем: это может быть образ, который прямо сейчас пушит сборка
      # другой ветки, а его оглавление с тегом ещё не появилось.
      # Шаг последний и не роняет сборку: образ и proto-контракт к этому времени уже на месте, а
      # недоудалённое доберёт следующая сборка. GITHUB_TOKEN удаляет версии, только если у репозитория
      # роль Admin на пакет (страница пакета → Package settings → Manage Actions access).
      - if: inputs.keep-untagged != ''
        continue-on-error: true
        env:
          IMAGE: ${{ inputs.image }}
          KEEP: ${{ inputs.keep-untagged }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          api="https://api.github.com/orgs/$OWNER/packages/container"
          accept="Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json"
          tmp="$RUNNER_TEMP/untagged"
          mkdir -p "$tmp"
          for pkg in $(for i in ${IMAGE:-${GITHUB_REPOSITORY#*/}:latest}; do echo "${i%%:*}"; done | sort -u); do
            url="$api/${pkg//\//%2F}/versions"
            # версии пакета строками: дата id digest число-тегов
            : > "$tmp/versions"
            for page in $(seq 1 100); do
              curl -fsS -H "Authorization: Bearer $TOKEN" -o "$tmp/page.json" "$url?per_page=100&page=$page"
              [ "$(jq length "$tmp/page.json")" = 0 ] && break
              jq -r '.[] | "\(.created_at) \(.id) \(.name) \(.metadata.container.tags | length)"' "$tmp/page.json" >> "$tmp/versions"
            done
            # части образов с тегом — из их оглавлений в реестре
            reg=$(curl -fsS -u "$GITHUB_ACTOR:$TOKEN" "https://ghcr.io/token?service=ghcr.io&scope=repository:$OWNER/$pkg:pull" | jq -r .token)
            : > "$tmp/used"
            for digest in $(awk '$4 > 0 {print $3}' "$tmp/versions"); do
              curl -fsS -H "Authorization: Bearer $reg" -H "$accept" "https://ghcr.io/v2/$OWNER/$pkg/manifests/$digest" \
                | jq -r '.manifests[]?.digest' >> "$tmp/used"
            done
            # без тега, не часть образа с тегом и старше часа; новые первыми — KEEP самых свежих остаются
            awk -v before="$(date -u -d '-1 hour' +%Y-%m-%dT%H:%M:%SZ)" \
              'FILENAME == ARGV[1] {used[$1]; next} $4 == 0 && !($3 in used) && $1 < before' "$tmp/used" "$tmp/versions" \
              | sort -r | tail -n +$((KEEP + 1)) | cut -d' ' -f2 > "$tmp/old"
            echo "$pkg: версий $(wc -l < "$tmp/versions"), частей образов с тегом $(wc -l < "$tmp/used"), удаляется $(wc -l < "$tmp/old")"
            for id in $(cat "$tmp/old"); do
              code=$(curl -sS -o "$tmp/delete.json" -w '%{http_code}' -X DELETE -H "Authorization: Bearer $TOKEN" "$url/$id")
              case $code in
                204|404) ;;  # 404 — версию уже удалила параллельная сборка другой ветки
                *)
                  echo "::warning::Не удалось удалить версию $id пакета $pkg (HTTP $code: $(jq -r '.message // empty' "$tmp/delete.json" 2>/dev/null)). Нет роли Admin на пакет — дать в Package settings → Manage Actions access; лимит запросов GitHub — доудалит следующая сборка"
                  exit 1
                  ;;
              esac
            done
          done
